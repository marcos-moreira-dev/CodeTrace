name: Verify practice curriculum
on:
  push:
    branches: ['feature/practice-curriculum-20261120']
  pull_request:
    paths:
      - 'src/main/resources/practice/**'
      - 'scripts/verificar-biblioteca.sh'
      - '.github/workflows/practice-curriculum.yml'
jobs:
  practice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: TypeScript 5.9 and NASM toolchain
        run: |
          npm install --global typescript@5.9.3
          sudo apt-get update -qq
          sudo apt-get install -y nasm
      - name: Compile and run representative clients
        run: bash scripts/verificar-biblioteca.sh
  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and execute PowerShell 7 lessons
        shell: pwsh
        run: |
          Get-ChildItem "src/main/resources/practice/powershell" -Recurse -Filter "*.ps1" | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Syntax $($_.Name): $($errors -join '; ')" }
          }
          & .\src\main\resources\practice\powershell\01-fundamentos\pipeline-objetos\pipeline_objetos.ps1
          & .\src\main\resources\practice\powershell\03-algoritmos\busqueda-binaria\busqueda_binaria.ps1

          & .\src\main\resources\practice\powershell\01-fundamentos\json-y-objetos\json_y_objetos.ps1
          & .\src\main\resources\practice\powershell\02-estructuras-datos\cola-generica\cola_generica.ps1
          & .\src\main\resources\practice\powershell\03-algoritmos\frecuencias-objetos\frecuencias_objetos.ps1
      - name: Execute Windows CMD lessons
        shell: pwsh
        run: |
          & cmd /c "src\main\resources\practice\cmd\01-fundamentos\expansion-retardada\expansion_retardada.cmd"
          if ($LASTEXITCODE -ne 0) { throw "CMD variables" }
          & cmd /c "src\main\resources\practice\cmd\01-fundamentos\subrutinas\subrutinas.cmd"
          if ($LASTEXITCODE -ne 0) { throw "CMD subroutines" }

          & cmd /c "src\main\resources\practice\cmd\01-fundamentos\for-f-registros\for_f_registros.cmd"
          if ($LASTEXITCODE -ne 0) { throw "CMD records" }
          & cmd /c "src\main\resources\practice\cmd\03-algoritmos\maximo-iterativo\maximo_iterativo.cmd"
          if ($LASTEXITCODE -ne 0) { throw "CMD max" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run C# 12 LINQ exercise
        shell: pwsh
        run: |
          dotnet new console -o "$env:RUNNER_TEMP\csharp-practice" --framework net8.0
          Copy-Item "src/main/resources/practice/csharp/01-fundamentos/linq/linq.cs" "$env:RUNNER_TEMP\csharp-practice\Program.cs" -Force
          dotnet run --project "$env:RUNNER_TEMP\csharp-practice"
          if ($LASTEXITCODE -ne 0) { throw "C# lesson" }

          $extra = @(
            "01-fundamentos/nullable-records/nullable_records.cs",
            "01-fundamentos/yield-iteradores/yield_iteradores.cs",
            "01-fundamentos/async-tasks/async_tasks.cs",
            "02-estructuras-datos/heap-prioridades/heap_prioridades.cs",
            "03-algoritmos/bfs-grafo/bfs_grafo.cs",
            "03-algoritmos/mochila-01/mochila_01.cs",
            "04-patrones-diseno/adapter/unidades/adapter_unidades.cs"
          )
          foreach ($archivo in $extra) {
            $fuente = Join-Path "src/main/resources/practice/csharp" $archivo
            Copy-Item $fuente "$env:RUNNER_TEMP\csharp-practice\Program.cs" -Force
            dotnet run --project "$env:RUNNER_TEMP\csharp-practice"
            if ($LASTEXITCODE -ne 0) { throw "C# failed: $archivo" }
          }

  kotlin-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and verify Kotlin 2.2.0 compiler
        run: |
          curl --retry 3 -fsSL \
            "https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip" \
            -o "$RUNNER_TEMP/kotlin-compiler.zip"
          echo "1adb6f1a5845ba0aa5a59e412e44c8e405236b957de1a9683619f1dca3b16932  $RUNNER_TEMP/kotlin-compiler.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile and execute idiomatic Kotlin 2.2 clients
        shell: bash
        run: |
          set -euo pipefail
          base="src/main/resources/practice/kotlin"
          for archivo in \
            01-fundamentos/secuencias-perezosas/secuencias_perezosas.kt \
            01-fundamentos/varianza-genericos/varianza_genericos.kt \
            02-estructuras-datos/heap-prioridades/heap_prioridades.kt \
            03-algoritmos/bfs-grafo/bfs_grafo.kt \
            03-algoritmos/mochila-01/mochila_01.kt \
            04-patrones-diseno/adapter/unidades/adapter_unidades.kt \
            04-patrones-diseno/decorator/notificaciones/decorator_notificaciones.kt; do
            kotlinc -jvm-target 21 "$base/$archivo" -include-runtime -d "$RUNNER_TEMP/kotlin-sample.jar"
            java -jar "$RUNNER_TEMP/kotlin-sample.jar" >/dev/null
          done
          kotlinc -jvm-target 21 \
            "$base/04-patrones-diseno/factory/basico/Factory.kt" \
            "$base/04-patrones-diseno/factory/basico/MainFactory.kt" \
            -include-runtime -d "$RUNNER_TEMP/factory.jar"
          java -jar "$RUNNER_TEMP/factory.jar" >/dev/null
          kotlinc -jvm-target 21 \
            "$base/04-patrones-diseno/observer/basico/Observador.kt" \
            "$base/04-patrones-diseno/observer/basico/MainObservador.kt" \
            -include-runtime -d "$RUNNER_TEMP/observer.jar"
          java -jar "$RUNNER_TEMP/observer.jar" >/dev/null
