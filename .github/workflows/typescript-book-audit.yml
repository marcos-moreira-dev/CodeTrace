name: Audit TypeScript book import
on:
  pull_request:
    paths:
      - 'curriculum/typescript-book/**'
      - 'scripts/auditar-typescript-libro.py'
      - '.github/workflows/typescript-book-audit.yml'
  workflow_dispatch:
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global typescript@7.0.2
      - run: python3 scripts/auditar-typescript-libro.py
      - uses: actions/upload-artifact@v4
        with:
          name: typescript-book-audit
          path: typescript-book-audit.json
